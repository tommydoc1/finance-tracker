<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f6f5c'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <script>
    // apply the saved theme before first paint (full settings load in app.js)
    try { var u = JSON.parse(localStorage.getItem('ui') || '{}'); document.documentElement.dataset.theme = u.theme || 'auto';
      if (u.accent) document.documentElement.style.setProperty('--accent', u.accent); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo"></span>Finance</div>
    <nav>
      <a href="#/" data-nav="dashboard">Overview</a>
      <a href="#/accounts" data-nav="accounts">Accounts</a>
      <a href="#/income" data-nav="income">Income &amp; charges</a>
      <a href="#/recurring" data-nav="recurring">Recurring</a>
      <a href="#/data" data-nav="data">Data &amp; settings</a>
    </nav>
    <div class="sidebar-foot" id="foot"></div>
  </aside>
  <main id="view"><div class="loading">Loading…</div></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <header><h3 id="modal-title"></h3><button type="button" class="icon" data-close aria-label="Close">×</button></header>
      <div id="modal-body"></div>
      <p class="hint" id="modal-hint"></p>
      <footer><button type="button" class="ghost" data-close>Cancel</button><button type="submit" class="primary" id="modal-submit">Save</button></footer>
    </form>
  </dialog>
  <div id="toast"></div>

  <script src="/static/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
